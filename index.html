<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>La Enredadera Kultural · Bakatá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: #0d0a08;
    color: #f5e9d8;
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  ::selection { background: #ea580c; color: #fff; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }
  a { color: inherit; text-decoration: none; }
  img, svg { display: block; max-width: 100%; }

  .display { font-family: 'Archivo Black', sans-serif; letter-spacing: -0.02em; line-height: 0.92; }
  .serif { font-family: 'Playfair Display', Georgia, serif; }
  .serif-i { font-family: 'Playfair Display', Georgia, serif; font-style: italic; }
  .mono-up { text-transform: uppercase; letter-spacing: 0.25em; font-weight: 500; font-size: 11px; }

  .container { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
  .container-narrow { max-width: 880px; margin: 0 auto; padding: 0 24px; }

  /* ====== HEADER ====== */
  header.nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(13, 10, 8, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(245, 233, 216, 0.08);
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
  .nav-links { display: none; gap: 32px; }
  @media (min-width: 900px) { .nav-links { display: flex; } }
  .nav-link {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: rgba(245, 233, 216, 0.55);
    font-weight: 500;
    padding: 8px 0;
    border-bottom: 1px solid transparent;
    transition: all 0.2s;
  }
  .nav-link:hover { color: #f5e9d8; }
  .nav-link.active { color: #ea580c; border-bottom-color: #ea580c; }

  .logo-wrap { display: flex; align-items: center; gap: 12px; }
  .logo-text { display: none; line-height: 1.1; }
  @media (min-width: 600px) { .logo-text { display: block; } }
  .logo-text .a {
    font-family: 'Archivo Black', sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: #f5e9d8;
  }
  .logo-text .b {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: rgba(234, 88, 12, 0.8);
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* ====== BUTTONS ====== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 10px;
    padding: 14px 26px;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    transition: all 0.2s;
    border: 1px solid;
    cursor: pointer;
  }
  .btn-primary { color: #fff; background: #ea580c; border-color: #ea580c; }
  .btn-primary:hover { background: #c2410c; border-color: #c2410c; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; background: #ea580c; }
  .btn-ghost { color: #f5e9d8; background: transparent; border-color: rgba(245, 233, 216, 0.25); }
  .btn-ghost:hover { border-color: #f5e9d8; }

  /* ====== HERO ====== */
  .hero {
    position: relative;
    padding: 56px 0 72px;
    overflow: hidden;
  }
  @media (min-width: 768px) { .hero { padding: 80px 0 96px; } }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 16px;
    color: #ea580c;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 32px;
  }
  .hero-eyebrow::before {
    content: ""; width: 32px; height: 1px; background: #ea580c;
  }
  .hero-h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(52px, 11vw, 132px);
    line-height: 0.92;
    letter-spacing: -0.025em;
    color: #f5e9d8;
  }
  .hero-h1 .accent { color: #ea580c; }
  .hero-h1 .gold {
    color: #d4a447;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .hero-p {
    margin-top: 28px;
    max-width: 480px;
    font-size: 16px;
    line-height: 1.65;
    color: rgba(245, 233, 216, 0.65);
  }
  .hero-cta { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px; }

  /* ====== TICKER ====== */
  .ticker {
    border-top: 1px solid rgba(245, 233, 216, 0.1);
    border-bottom: 1px solid rgba(245, 233, 216, 0.1);
    overflow: hidden;
    background: rgba(0, 0, 0, 0.3);
  }
  .ticker-track {
    display: flex;
    gap: 64px;
    padding: 18px 0;
    white-space: nowrap;
    animation: ticker 40s linear infinite;
    width: max-content;
  }
  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .ticker-item {
    display: inline-flex; align-items: center; gap: 16px;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245, 233, 216, 0.5);
  }
  .ticker-item .accent { color: #ea580c; }

  /* ====== SECTIONS ====== */
  section { position: relative; }
  .sec { padding: 80px 0; }
  @media (min-width: 768px) { .sec { padding: 112px 0; } }
  .sec-head { margin-bottom: 56px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 11px; letter-spacing: 0.3em; color: #ea580c;
    text-transform: uppercase; font-weight: 500; margin-bottom: 16px;
  }
  .eyebrow::before { content: ""; width: 24px; height: 1px; background: #ea580c; }
  .h2 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(36px, 6vw, 64px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: #f5e9d8;
  }
  .h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(44px, 8vw, 88px);
    line-height: 0.95;
    letter-spacing: -0.025em;
    color: #f5e9d8;
  }
  .lead {
    font-size: 17px; line-height: 1.65;
    color: rgba(245, 233, 216, 0.65); max-width: 560px;
    margin-top: 24px;
  }

  /* ====== EVENT CARDS - flyer style ====== */
  .grid-3 { display: grid; gap: 24px; }
  @media (min-width: 760px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1040px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
  .grid-4 { display: grid; gap: 20px; }
  @media (min-width: 600px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 960px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }

  .flyer {
    position: relative;
    background: #0d0a08;
    border: 1px solid rgba(245, 233, 216, 0.1);
    overflow: hidden;
    transition: border-color 0.3s;
    text-align: left;
    width: 100%;
    display: block;
    cursor: pointer;
  }
  .flyer:hover { border-color: rgba(234, 88, 12, 0.4); }
  .flyer-cat {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-style: italic;
    color: #f5e9d8;
    font-size: 24px;
    line-height: 1.05;
    padding: 20px 24px 12px;
    display: block;
  }
  .flyer-art {
    position: relative;
    aspect-ratio: 4/5;
    margin: 0 24px;
    overflow: hidden;
  }
  .flyer-art-inner { position: absolute; inset: 0; }
  .flyer-vert {
    position: absolute;
    top: 0;
    left: -28px;
    height: 100%;
    width: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .flyer-vert span {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 9px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(245, 233, 216, 0.45);
    font-weight: 500;
  }
  .flyer-date {
    position: absolute;
    top: 0;
    right: -28px;
    height: 100%;
    width: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .flyer-date span {
    writing-mode: vertical-rl;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #d4a447;
    font-weight: 500;
  }
  .flyer-info {
    padding: 16px 24px 0;
  }
  .flyer-title {
    font-family: 'Archivo Black', sans-serif;
    color: #ea580c;
    font-size: 18px;
    line-height: 1.1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .flyer-sub {
    font-size: 11px;
    letter-spacing: 0.18em;
    color: rgba(245, 233, 216, 0.6);
    text-transform: uppercase;
    line-height: 1.4;
  }
  .flyer-foot {
    margin-top: 18px;
    padding: 14px 24px;
    border-top: 1px solid rgba(245, 233, 216, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .flyer-pin {
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #ea580c;
    font-weight: 500;
  }
  .flyer-price {
    font-family: 'Archivo Black', sans-serif;
    font-size: 14px;
    color: #f5e9d8;
  }
  .flyer-lek {
    position: absolute;
    bottom: 60px;
    left: 24px;
    z-index: 2;
  }

  /* Decorative gradient blob behind hero */
  .hero::before {
    content: "";
    position: absolute;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(234, 88, 12, 0.18), transparent 70%);
    filter: blur(80px);
    pointer-events: none;
  }
  .hero::after {
    content: "";
    position: absolute;
    bottom: -200px; left: -200px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(212, 164, 71, 0.12), transparent 70%);
    filter: blur(80px);
    pointer-events: none;
  }

  /* ====== QUOTE ====== */
  .quote-sec {
    padding: 96px 0;
    border-top: 1px solid rgba(245, 233, 216, 0.08);
    border-bottom: 1px solid rgba(245, 233, 216, 0.08);
  }
  .quote-bar { display: inline-block; width: 40px; height: 1px; background: #ea580c; margin-bottom: 28px; }
  .quote { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(22px, 3.4vw, 36px); color: #f5e9d8; line-height: 1.45; }
  .quote-attr { margin-top: 28px; font-size: 11px; letter-spacing: 0.3em; color: rgba(234, 88, 12, 0.75); text-transform: uppercase; }

  /* ====== CATEGORIES ====== */
  .cats { display: grid; gap: 1px; background: rgba(245, 233, 216, 0.1); border-top: 1px solid rgba(245, 233, 216, 0.1); border-bottom: 1px solid rgba(245, 233, 216, 0.1); }
  @media (min-width: 768px) { .cats { grid-template-columns: repeat(3, 1fr); } }
  .cat {
    background: #0d0a08;
    padding: 56px 32px;
    transition: background 0.3s;
  }
  .cat:hover { background: #14100d; }
  .cat-num {
    font-family: 'Archivo Black', sans-serif;
    color: #ea580c;
    font-size: 14px;
    letter-spacing: 0.05em;
    margin-bottom: 24px;
  }
  .cat-title {
    font-family: 'Archivo Black', sans-serif;
    font-size: 28px;
    color: #f5e9d8;
    margin-bottom: 16px;
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  .cat-title .it {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #d4a447;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .cat-desc { color: rgba(245, 233, 216, 0.6); line-height: 1.65; font-size: 14px; }

  /* ====== FILTERS ====== */
  .filter-bar {
    display: flex; flex-direction: column; gap: 16px; margin-bottom: 48px;
    padding-bottom: 32px;
    border-bottom: 1px solid rgba(245, 233, 216, 0.08);
  }
  @media (min-width: 760px) { .filter-bar { flex-direction: row; align-items: center; } }
  .search-wrap { position: relative; flex: 1; max-width: 400px; }
  .search-icon { position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: rgba(245, 233, 216, 0.4); }
  .search-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(245, 233, 216, 0.15);
    padding: 12px 4px 12px 32px;
    color: #f5e9d8;
    font-size: 14px;
  }
  .search-input::placeholder { color: rgba(245, 233, 216, 0.4); }
  .search-input:focus { outline: none; border-bottom-color: #ea580c; }
  .chips { display: flex; gap: 4px; }
  .chip {
    padding: 8px 16px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    border: 1px solid rgba(245, 233, 216, 0.15);
    color: rgba(245, 233, 216, 0.6);
    transition: all 0.2s;
  }
  .chip:hover { color: #f5e9d8; border-color: rgba(245, 233, 216, 0.4); }
  .chip.active { background: #ea580c; border-color: #ea580c; color: #fff; }

  /* ====== INPUTS ====== */
  .input {
    width: 100%;
    background: rgba(245, 233, 216, 0.04);
    border: 1px solid rgba(245, 233, 216, 0.12);
    padding: 14px 16px;
    color: #f5e9d8;
    font-size: 14px;
    transition: border-color 0.2s;
  }
  .input:focus { outline: none; border-color: #ea580c; background: rgba(245, 233, 216, 0.06); }
  .input::placeholder { color: rgba(245, 233, 216, 0.35); }

  /* ====== DETAIL ====== */
  .detail-grid { display: grid; gap: 56px; }
  @media (min-width: 1024px) { .detail-grid { grid-template-columns: 1fr 1fr; } }
  .detail-art {
    position: relative;
    aspect-ratio: 3/4;
    background: #0d0a08;
    border: 1px solid rgba(245, 233, 216, 0.1);
    overflow: hidden;
  }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(245, 233, 216, 0.1); border: 1px solid rgba(245, 233, 216, 0.1); }
  .info-cell {
    background: #0d0a08;
    padding: 18px 20px;
  }
  .info-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: rgba(234, 88, 12, 0.85);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .info-value { color: #f5e9d8; font-size: 14px; font-weight: 500; }

  .tag {
    display: inline-block;
    padding: 5px 12px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border: 1px solid rgba(245, 233, 216, 0.15);
    color: rgba(245, 233, 216, 0.7);
    font-weight: 500;
  }

  .qty-btn {
    width: 38px; height: 38px;
    border: 1px solid rgba(245, 233, 216, 0.2);
    color: #f5e9d8;
    font-size: 18px;
    line-height: 1;
    transition: all 0.2s;
  }
  .qty-btn:hover { border-color: #ea580c; color: #ea580c; }

  /* ====== FOOTER ====== */
  footer { border-top: 1px solid rgba(245, 233, 216, 0.08); margin-top: 80px; }
  .foot-grid { display: grid; gap: 40px; padding: 64px 0; }
  @media (min-width: 760px) { .foot-grid { grid-template-columns: 2fr 1fr 1fr; } }
  .foot-end {
    padding: 24px 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(245, 233, 216, 0.3);
    border-top: 1px solid rgba(245, 233, 216, 0.05);
  }

  /* ====== MOBILE ====== */
  .menu-btn { display: block; }
  @media (min-width: 900px) { .menu-btn { display: none; } }
  .mobile-menu {
    background: #0d0a08;
    border-top: 1px solid rgba(245, 233, 216, 0.08);
  }
  .mobile-menu-inner { padding: 16px 24px; display: flex; flex-direction: column; gap: 4px; }
  .mobile-menu button {
    text-align: left;
    padding: 12px 0;
    color: rgba(245, 233, 216, 0.75);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
    border-bottom: 1px solid rgba(245, 233, 216, 0.05);
  }
  .hide-on-mobile { display: none; }
  @media (min-width: 600px) { .hide-on-mobile { display: inline-flex; } }

  /* Misc */
  .row { display: flex; align-items: center; justify-content: space-between; }
  .stack > * + * { margin-top: 12px; }
  .stack-lg > * + * { margin-top: 24px; }
  .stack-xl > * + * { margin-top: 32px; }
  .text-muted { color: rgba(245, 233, 216, 0.6); }
  .text-faint { color: rgba(245, 233, 216, 0.4); }
  .text-orange { color: #ea580c; }
  .text-gold { color: #d4a447; }
  .border-t { border-top: 1px solid rgba(245, 233, 216, 0.08); padding-top: 24px; }
  .price-card { background: rgba(245, 233, 216, 0.04); border: 1px solid rgba(245, 233, 216, 0.1); padding: 20px; }
  .order-row {
    background: rgba(245, 233, 216, 0.03);
    border: 1px solid rgba(245, 233, 216, 0.08);
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .empty {
    background: rgba(245, 233, 216, 0.03);
    border: 1px solid rgba(245, 233, 216, 0.08);
    padding: 48px 24px;
    text-align: center;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: rgba(245, 233, 216, 0.5);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 32px;
    font-weight: 500;
  }
  .back-link:hover { color: #f5e9d8; }
  .check-mark {
    display: inline-flex;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: #ea580c;
    align-items: center; justify-content: center;
    margin-bottom: 32px;
  }
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#ea580c;font-family:'Archivo Black',sans-serif;font-size:14px;letter-spacing:0.4em;">
    LEK · CARGANDO
  </div>
</div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

/* ===== ARTIST PORTRAIT (SVG-generated, like flyer poster) ===== */
function ArtistPortrait({ event }) {
  const themes = {
    music: { bg: '#1a0d05', fg: '#ea580c', accent: '#d4a447' },
    reading: { bg: '#0a1218', fg: '#d4a447', accent: '#ea580c' },
    film: { bg: '#1a0810', fg: '#ec4899', accent: '#d4a447' },
  };
  const t = themes[event.type] || themes.music;
  const seed = event.id.charCodeAt(0) + event.id.charCodeAt(1) + event.id.charCodeAt(2);
  const angle = (seed * 7) % 60 - 30;

  return h('svg', {
    viewBox: '0 0 300 400',
    preserveAspectRatio: 'xMidYMid slice',
    style: { width: '100%', height: '100%', display: 'block' }
  },
    h('defs', null,
      h('radialGradient', { id: 'glow' + event.id, cx: '50%', cy: '40%', r: '60%' },
        h('stop', { offset: '0%', stopColor: t.fg, stopOpacity: 0.4 }),
        h('stop', { offset: '100%', stopColor: t.bg, stopOpacity: 1 })
      ),
      h('pattern', { id: 'grain' + event.id, x: 0, y: 0, width: 4, height: 4, patternUnits: 'userSpaceOnUse' },
        h('rect', { width: 4, height: 4, fill: t.bg }),
        h('circle', { cx: 1, cy: 1, r: 0.3, fill: t.fg, opacity: 0.15 }),
        h('circle', { cx: 3, cy: 3, r: 0.2, fill: t.accent, opacity: 0.1 })
      )
    ),
    h('rect', { width: 300, height: 400, fill: 'url(#grain' + event.id + ')' }),
    h('rect', { width: 300, height: 400, fill: 'url(#glow' + event.id + ')' }),

    /* Decorative shapes — different per event type */
    event.type === 'music' && h('g', { key: 'm', transform: `translate(150, 200) rotate(${angle})` },
      h('circle', { cx: 0, cy: 0, r: 90, fill: 'none', stroke: t.fg, strokeWidth: 1, opacity: 0.4 }),
      h('circle', { cx: 0, cy: 0, r: 70, fill: 'none', stroke: t.fg, strokeWidth: 1, opacity: 0.5 }),
      h('circle', { cx: 0, cy: 0, r: 50, fill: t.bg, stroke: t.accent, strokeWidth: 1 }),
      h('circle', { cx: 0, cy: 0, r: 8, fill: t.fg }),
      h('circle', { cx: 0, cy: 0, r: 2, fill: t.bg })
    ),
    event.type === 'reading' && h('g', { key: 'r' },
      h('rect', { x: 90, y: 100, width: 120, height: 180, fill: t.bg, stroke: t.fg, strokeWidth: 1.5 }),
      h('rect', { x: 100, y: 110, width: 100, height: 160, fill: 'none', stroke: t.accent, strokeWidth: 0.5 }),
      h('text', { x: 150, y: 200, textAnchor: 'middle', fill: t.fg, fontFamily: 'Playfair Display, serif', fontStyle: 'italic', fontSize: 18 }, 'libro'),
      h('line', { x1: 110, y1: 220, x2: 190, y2: 220, stroke: t.fg, strokeWidth: 0.5, opacity: 0.6 }),
      h('line', { x1: 110, y1: 230, x2: 180, y2: 230, stroke: t.fg, strokeWidth: 0.5, opacity: 0.6 }),
      h('line', { x1: 110, y1: 240, x2: 185, y2: 240, stroke: t.fg, strokeWidth: 0.5, opacity: 0.6 })
    ),
    event.type === 'film' && h('g', { key: 'f' },
      h('rect', { x: 60, y: 130, width: 180, height: 120, fill: t.bg, stroke: t.fg, strokeWidth: 1.5 }),
      [...Array(8)].map((_, i) => h('rect', { key: i, x: 65 + i * 22, y: 135, width: 8, height: 4, fill: t.fg })),
      [...Array(8)].map((_, i) => h('rect', { key: 'b' + i, x: 65 + i * 22, y: 241, width: 8, height: 4, fill: t.fg })),
      h('circle', { cx: 150, cy: 190, r: 24, fill: 'none', stroke: t.accent, strokeWidth: 1.5 }),
      h('polygon', { points: '142,178 142,202 162,190', fill: t.accent })
    ),

    /* Decorative tendrils (enredadera = vine) */
    h('path', {
      d: 'M 20 50 Q 40 80 30 110 Q 20 140 40 170',
      fill: 'none',
      stroke: t.accent,
      strokeWidth: 0.8,
      opacity: 0.4
    }),
    h('path', {
      d: 'M 280 60 Q 260 90 270 120 Q 280 150 260 180',
      fill: 'none',
      stroke: t.accent,
      strokeWidth: 0.8,
      opacity: 0.4
    }),
    h('circle', { cx: 25, cy: 110, r: 3, fill: t.accent, opacity: 0.6 }),
    h('circle', { cx: 275, cy: 120, r: 3, fill: t.accent, opacity: 0.6 }),

    /* Bottom artist name */
    h('text', {
      x: 150, y: 350,
      textAnchor: 'middle',
      fontFamily: 'Archivo Black, sans-serif',
      fontSize: 22,
      fill: t.fg,
      letterSpacing: '1'
    }, event.title.toUpperCase().slice(0, 18)),
    h('text', {
      x: 150, y: 372,
      textAnchor: 'middle',
      fontFamily: 'Inter, sans-serif',
      fontSize: 8,
      fill: t.accent,
      letterSpacing: '3',
      fontWeight: 500
    }, event.subtitle.toUpperCase().slice(0, 36))
  );
}

const fmtCOP = n => "$" + n.toLocaleString("es-CO");
const fmtDate = iso => {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("es-CO", { weekday:"long", day:"numeric", month:"long" });
};
const dayShort = iso => {
  const d = new Date(iso + "T00:00:00");
  const dow = d.toLocaleDateString("es-CO",{weekday:"long"}).toUpperCase();
  const dn = d.getDate().toString().padStart(2, '0');
  const mo = (d.getMonth()+1).toString().padStart(2, '0');
  return dow + ' ' + dn + '.' + mo;
};

  });

  const login = (email, name) => {
    const e = (email || '').toLowerCase();
    const isAdmin = e.includes('admin') || e === 'lek@lek.co';
    setUser({ email, name: name || email.split("@")[0], role: isAdmin ? 'admin' : 'user' });
  };
  const logout = () => setUser(null);
  const register = (email, name) => login(email, name);
  const addOrder = (o) => {
    const order = { ...o, id: "LEK-" + Math.random().toString(36).slice(2,7).toUpperCase(), status: 'confirmed', createdAt: new Date().toISOString() };
    setOrders(prev => [order, ...prev]);
    return order;
  };

    const order = { ...o, id: "SHP-" + Math.random().toString(36).slice(2,7).toUpperCase(), status: 'confirmed', createdAt: new Date().toISOString() };
    setShopOrders(prev => [order, ...prev]);
    setCart([]);
    return order;
  };
  const addToCart = (product, qty) => {
    qty = qty || 1;
    setCart(prev => {
      const existing = prev.find(c => c.id === product.id);
      if (existing) return prev.map(c => c.id === product.id ? { ...c, qty: c.qty + qty } : c);
      return [...prev, { ...product, qty }];
    });
  };
  const updateCartQty = (id, qty) => {
    if (qty <= 0) return setCart(prev => prev.filter(c => c.id !== id));
    setCart(prev => prev.map(c => c.id === id ? { ...c, qty } : c));
  };
  const removeFromCart = (id) => setCart(prev => prev.filter(c => c.id !== id));

  const updateEvent = (id, patch) => setEvents(prev => prev.map(e => e.id === id ? { ...e, ...patch } : e));

  const deleteEvent = (id) => setEvents(prev => prev.filter(e => e.id !== id));
  const updateOrder = (id, patch) => setOrders(prev => prev.map(o => o.id === id ? { ...o, ...patch } : o));
  const deleteOrder = (id) => setOrders(prev => prev.filter(o => o.id !== id));
  const addPublication = (p) => setPublications(prev => [{ ...p, id: 'pub-' + Date.now() }, ...prev]);
  const updatePublication = (id, patch) => setPublications(prev => prev.map(p => p.id === id ? { ...p, ...patch } : p));
  const deletePublication = (id) => setPublications(prev => prev.filter(p => p.id !== id));
  const addProduct = (p) => setProducts(prev => [{ ...p, id: 'sh-' + Date.now() }, ...prev]);
  const updateProduct = (id, patch) => setProducts(prev => prev.map(p => p.id === id ? { ...p, ...patch } : p));
  const deleteProduct = (id) => setProducts(prev => prev.filter(p => p.id !== id));
  const addMenuItem = (m) => setMenu(prev => [{ ...m, id: 'm-' + Date.now() }, ...prev]);
  const updateMenuItem = (id, patch) => setMenu(prev => prev.map(m => m.id === id ? { ...m, ...patch } : m));
  const deleteMenuItem = (id) => setMenu(prev => prev.filter(m => m.id !== id));
  const addCocktail = (c) => setCocktails(prev => [{ ...c, id: 'c-' + Date.now() }, ...prev]);
  const updateCocktail = (id, patch) => setCocktails(prev => prev.map(c => c.id === id ? { ...c, ...patch } : c));
  const deleteCocktail = (id) => setCocktails(prev => prev.filter(c => c.id !== id));
  const updateSiteContent = (patch) => setSiteContent(prev => ({ ...prev, ...patch }));

  return h(Ctx.Provider, {
    value: {
      user, login, logout, register,
      orders, addOrder, updateOrder, deleteOrder,
      shopOrders, addShopOrder,
      cart, addToCart, updateCartQty, removeFromCart,
      events, updateEvent, addEvent, deleteEvent,
      publications, addPublication, updatePublication, deletePublication,
      products, addProduct, updateProduct, deleteProduct,

/* ===== EVENT DETAIL ===== */
function EventDetail({ eventId, setRoute, setOrder }) {
  const { events, user, addOrder } = useApp();
  const event = events.find(e => e.id === eventId);
  const [qty, setQty] = useState(1);
  const [step, setStep] = useState('info');
  const [guestName, setGuestName] = useState('');
  const [guestEmail, setGuestEmail] = useState('');
  const [card, setCard] = useState('');
  const [exp, setExp] = useState('');
  const [cvc, setCvc] = useState('');
  const [processing, setProcessing] = useState(false);

  if (!event) return h('div', { style: { textAlign:'center', padding:'80px 24px', color:'rgba(245,233,216,0.6)' } }, 'Evento no encontrado.');
  const total = event.price * qty;
  const remaining = event.capacity - event.sold;

  const finalize = (asGuest) => {
    setProcessing(true);
    setTimeout(() => {
      const order = addOrder({
        eventId: event.id, eventTitle: event.title, date: event.date, qty, total,
        buyerEmail: asGuest ? guestEmail : user.email,
        buyerName: asGuest ? guestName : user.name,
      });
      setOrder(order); setRoute('confirm'); setProcessing(false);
    }, 1100);
  };

  return h('div', { className: 'container', style: { padding: '48px 24px 80px', maxWidth: 1180 } },
    h('button', { className: 'back-link', onClick: () => setRoute('events') }, '← Volver a programación'),
    h('div', { className: 'detail-grid' },
      h('div', null,
        h('div', { className: 'detail-art' }, h(ArtistPortrait, { event })),
        h('div', { style: { marginTop: 16, display: 'flex', justifyContent: 'space-between', fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase', color: 'rgba(245,233,216,0.5)' } },
          h('span', null, 'Culturarte · Viche · Música'),
          h('span', { className: 'text-orange' }, 'LEK · Bakatá')
        )
      ),
      h('div', null,
        step === 'info' && h('div', { className: 'stack-xl' },
          h('div', null,
            h('div', { className: 'eyebrow' }, event.category),
            h('h1', { className: 'h1', style: { fontSize: 'clamp(36px, 5vw, 60px)' } }, event.title),
            h('p', { className: 'lead', style: { marginTop: 12 } }, event.subtitle)
          ),
          h('div', { className: 'info-grid' },
            h('div', { className: 'info-cell' },
              h('div', { className: 'info-label' }, 'Fecha'),
              h('div', { className: 'info-value', style: { textTransform: 'capitalize' } }, fmtDate(event.date))
            ),
            h('div', { className: 'info-cell' },
              h('div', { className: 'info-label' }, 'Hora'),
              h('div', { className: 'info-value' }, event.time + ' hrs')
            ),
            h('div', { className: 'info-cell' },
              h('div', { className: 'info-label' }, 'Lugar'),
              h('div', { className: 'info-value' }, 'Cra 4A #26B-72')
            ),
            h('div', { className: 'info-cell' },
              h('div', { className: 'info-label' }, 'Cupos'),
              h('div', { className: 'info-value' }, remaining + ' disponibles')
            )
          ),
          h('div', null,
            h('div', { className: 'eyebrow', style: { marginBottom: 12 } }, 'Sobre el encuentro'),
            h('p', { style: { color: 'rgba(245,233,216,0.7)', lineHeight: 1.7, fontSize: 15 } }, event.description)
          ),
          h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },
            event.tags.map(t => h('span', { key: t, className: 'tag' }, t))
          ),
          h('div', { className: 'border-t' },
            h('div', { className: 'row', style: { marginBottom: 20 } },
              h('span', { className: 'mono-up text-muted' }, 'Cantidad'),
              h('div', { style: { display: 'flex', alignItems: 'center', gap: 12 } },
                h('button', { className: 'qty-btn', onClick: () => setQty(Math.max(1, qty-1)) }, '−'),

            h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 } },
              h('input', { className: 'input', placeholder: 'MM/AA', value: exp, onChange: e => setExp(e.target.value) }),
              h('input', { className: 'input', placeholder: 'CVC', value: cvc, onChange: e => setCvc(e.target.value) })
            )
          ),
          h('button', {
            className: 'btn btn-primary',
            style: { width: '100%' },

            onClick: () => finalize(!user)
          }, processing ? 'Procesando…' : 'Pagar ' + fmtCOP(total)),

        )

  );

/* ===== CART / CHECKOUT ===== */
function Cart({ setRoute, setOrder }) {
  const { cart, updateCartQty, removeFromCart, addShopOrder, user } = useApp();
  const [step, setStep] = useState('cart');
  const [name, setName] = useState(user ? user.name : '');
  const [email, setEmail] = useState(user ? user.email : '');
  const [phone, setPhone] = useState('');
  const [address, setAddress] = useState('');
  const [card, setCard] = useState('');
  const [exp, setExp] = useState('');
  const [cvc, setCvc] = useState('');
  const [processing, setProcessing] = useState(false);

  const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const shipping = subtotal > 0 && cart.some(c => c.category !== 'Membresía') ? 12000 : 0;
  const total = subtotal + shipping;

  const finalize = () => {
    setProcessing(true);
    setTimeout(() => {
      const order = addShopOrder({
        items: cart.map(c => ({ id: c.id, name: c.name, qty: c.qty, price: c.price })),
        subtotal, shipping, total,
        buyerName: name, buyerEmail: email, buyerPhone: phone, address,
        type: 'shop'
      });
      setOrder(order);
      setRoute('shopConfirm');
      setProcessing(false);
    }, 1100);
  };

  if (cart.length === 0 && step === 'cart') {
    return h('div', { className: 'container-narrow', style: { padding: '80px 24px', textAlign: 'center' } },
      h('div', { className: 'eyebrow', style: { display: 'inline-flex', justifyContent: 'center' } }, 'Tu carrito'),
      h('h1', { className: 'h1' }, 'Aún está vacío'),
      h('p', { className: 'lead', style: { textAlign: 'center', margin: '24px auto 32px' } }, 'Echa un ojo a la tienda — vinilos, mercancía y membresías.'),
      h('button', { className: 'btn btn-primary', onClick: () => setRoute('shop') }, 'Ir a la tienda')

  return h('div', { className: 'container', style: { padding: '48px 24px 80px', maxWidth: 1100 } },
    h('button', { className: 'back-link', onClick: () => step === 'checkout' ? setStep('cart') : setRoute('shop') }, '← ' + (step === 'checkout' ? 'Volver al carrito' : 'Seguir comprando')),
    h('div', { style: { display: 'grid', gap: 48, gridTemplateColumns: '1fr', alignItems: 'flex-start' } },

          h('div', { className: 'eyebrow' }, step === 'checkout' ? 'Pago' : 'Carrito'),
          h('h1', { className: 'h1' }, step === 'checkout' ? 'Finalizar compra' : 'Tu carrito')

        route === 'events' && h(EventsPage, { setRoute, setEventId }),
        route === 'event' && h(EventDetail, { eventId, setRoute, setOrder }),
        route === 'confirm' && h(Confirm, { order, setRoute }),
        route === 'publications' && h(Publications),
        route === 'about' && h(About),
        route === 'auth' && h(Auth, { setRoute }),
        route === 'account' && h(Account, { setRoute }),
        route === 'admin' && h(Admin, { setRoute }),
        route === 'shop' && h(Shop, { setRoute }),
        route === 'cart' && h(Cart, { setRoute, setOrder }),
        route === 'shopConfirm' && h(ShopConfirm, { order, setRoute }),
        route === 'menu' && h(Menu)
      ),
      h(Footer, { setRoute })
    )
  );
}

const root = document.getElementById('root');
root.innerHTML = '';
ReactDOM.createRoot(root).render(h(App));
</script>
</body>
</html>
